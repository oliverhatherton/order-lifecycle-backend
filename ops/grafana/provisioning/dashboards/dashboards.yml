# Loads every dashboard JSON under ops/grafana/dashboards (mounted at
# /var/lib/grafana/dashboards). Edit the JSON in git, not in the UI —
# UI edits to provisioned dashboards are not saved back.
apiVersion: 1
providers:
  - name: order-lifecycle
    folder: Order Lifecycle
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
